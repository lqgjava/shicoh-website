<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="factoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e4e8ec;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#factoryGrad)"/>
  <!-- 工厂建筑轮廓 -->
  <g transform="translate(100,150)">
    <rect x="0" y="50" width="120" height="150" fill="#c0c8d0"/>
    <rect x="130" y="80" width="100" height="120" fill="#b0b8c0"/>
    <rect x="240" y="30" width="140" height="170" fill="#a8b0b8"/>
    <!-- 窗户 -->
    <rect x="20" y="80" width="25" height="25" fill="#0066cc" opacity="0.3"/>
    <rect x="55" y="80" width="25" height="25" fill="#0066cc" opacity="0.3"/>
    <rect x="90" y="80" width="25" height="25" fill="#0066cc" opacity="0.3"/>
    <rect x="20" y="120" width="25" height="25" fill="#0066cc" opacity="0.3"/>
    <rect x="55" y="120" width="25" height="25" fill="#0066cc" opacity="0.3"/>
    <rect x="90" y="120" width="25" height="25" fill="#0066cc" opacity="0.3"/>
    <!-- 烟囱 -->
    <rect x="280" y="-30" width="20" height="60" fill="#9098a0"/>
    <rect x="320" y="-20" width="20" height="50" fill="#9098a0"/>
  </g>
  <!-- 齿轮图标 -->
  <g transform="translate(450,280)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0066cc" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#0066cc" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="#0066cc" opacity="0.5"/>
    <path d="M0,-40 L0,-50 M28,-28 L35,-35 M40,0 L50,0 M28,28 L35,35 M0,40 L0,50 M-28,28 L-35,35 M-40,0 L-50,0 M-28,-28 L-35,-35" stroke="#0066cc" stroke-width="4" opacity="0.3"/>
  </g>
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">工厂实景照片</text>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#999">请替换为真实工厂图片</text>
</svg>