<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="900" fill="url(#bannerGrad)"/>
  <!-- 抽象工业元素 -->
  <g opacity="0.1">
    <circle cx="200" cy="200" r="150" fill="#fff"/>
    <circle cx="1700" cy="700" r="200" fill="#fff"/>
    <rect x="800" y="100" width="300" height="300" fill="#fff"/>
  </g>
  <!-- 齿轮装饰 -->
  <g transform="translate(1600,200)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M0,-80 L0,-100 M56,-56 L70,-70 M80,0 L100,0 M56,56 L70,70 M0,80 L0,100 M-56,56 L-70,70 M-80,0 L-100,0 M-56,-56 L-70,-70" stroke="#fff" stroke-width="6"/>
  </g>
  <!-- 生产线示意 -->
  <g transform="translate(200,600)" opacity="0.1">
    <rect x="0" y="0" width="200" height="60" fill="#fff"/>
    <rect x="220" y="0" width="200" height="60" fill="#fff"/>
    <rect x="440" y="0" width="200" height="60" fill="#fff"/>
    <rect x="660" y="0" width="200" height="60" fill="#fff"/>
  </g>
</svg>